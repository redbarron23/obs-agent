[project]
name = "obs-agent"
version = "0.2.0"
description = "Multi-cloud cost triage agent with LLM tool-use"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "anthropic>=0.50.0",
    "openai>=1.0.0",
    "streamlit>=1.28.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "scikit-learn>=1.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "ruff>=0.17.0",
]

[tool.uv]
# Flat modules, not an installable package: uv manages the env only.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: tests that call live LLM APIs (require API keys)",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares params via Query()/Depends() defaults.
extend-immutable-calls = ["fastapi.Query", "fastapi.Depends"]
