name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: requirements*.txt

      - name: Install dependencies
        run: uv pip install --system -r requirements-dev.txt

      - name: Run unit tests
        run: python -m pytest tests/ -v --tb=short -m "not integration"

      - name: Run eval dry-run (deterministic)
        run: python evals.py --dry-run

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t obs-agent .

      - name: Smoke-test the API container
        run: |
          docker run -d --name obs-agent -p 8000:8000 obs-agent
          for i in $(seq 1 20); do
            curl -sf http://localhost:8000/health && break
            sleep 1
          done
          curl -sf http://localhost:8000/health
          curl -sf http://localhost:8000/openapi.json > /dev/null
          docker logs obs-agent
          docker rm -f obs-agent
