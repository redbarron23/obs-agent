name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      # --locked fails if uv.lock is out of date with pyproject.toml.
      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Check Markdown links
        run: uv run python scripts/check_markdown_links.py

      - name: Run unit tests
        run: uv run pytest tests/ -v --tb=short -m "not integration"

      - name: Run eval dry-run (deterministic)
        run: uv run evals.py --dry-run

  mlops:
    # Optional MLflow tracing/eval integration (dependency group "mlops").
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv and Python 3.12
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies (with mlops group)
        run: uv sync --locked --group mlops

      - name: Run MLflow integration tests
        env:
          MLFLOW_DISABLE_AGENT_HINT: "1"
        run: uv run pytest tests/test_observability.py -v --tb=short

  local-rag:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      COMPOSE_PROJECT_NAME: obs-rag-ci-${{ github.run_id }}-${{ github.run_attempt }}
      OBS_RAG_TRACE_SERVICE: obs-rag-ci-${{ github.run_id }}-${{ github.run_attempt }}
      OBS_JAEGER_UI_PORT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Record the consumer revision and pinned RAG source
        run: |
          git rev-parse HEAD
          docker compose -f compose.rag.yml config --format json | python -c 'import json,sys; print(json.load(sys.stdin)["services"]["rag"]["build"]["context"])'

      - name: Build and start the simulation
        run: docker compose -f compose.rag.yml up -d --build --wait --wait-timeout 600

      - name: Check real retrieval and authentication without an LLM
        run: docker compose -f compose.rag.yml --profile checks run --rm --no-deps smoke

      - name: Check graceful failure when RAG stops
        run: |
          docker compose -f compose.rag.yml stop rag
          docker compose -f compose.rag.yml --profile checks run --rm --no-deps smoke --rag-down

      - name: Enable Jaeger and verify the real consumer's retrieval trace
        run: |
          docker compose -f compose.rag.yml down
          docker compose -f compose.rag.yml -f compose.telemetry.yml up -d --build --wait --wait-timeout 600
          docker compose -f compose.rag.yml -f compose.telemetry.yml --profile checks run --rm --no-deps --entrypoint python smoke /checks/telemetry.py

      - name: Verify collector outage and fresh trace recovery
        run: |
          docker compose -f compose.rag.yml -f compose.telemetry.yml stop jaeger
          docker compose -f compose.rag.yml -f compose.telemetry.yml --profile checks run --rm --no-deps smoke
          docker compose -f compose.rag.yml -f compose.telemetry.yml start jaeger
          docker compose -f compose.rag.yml -f compose.telemetry.yml --profile checks run --rm --no-deps --entrypoint python smoke /checks/telemetry.py

      - name: Show service diagnostics
        if: always()
        run: docker compose -f compose.rag.yml -f compose.telemetry.yml logs --no-color api ui rag jaeger

      - name: Remove the disposable simulation
        if: always()
        run: docker compose -f compose.rag.yml -f compose.telemetry.yml down -v

  review-persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify review decisions survive container recreation
        run: python3 scripts/review_persistence_check.py

  browser-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install optional browser dependencies
        run: |
          uv sync --locked --group browser
          uv run --group browser playwright install --with-deps chromium
      - name: Review, save, reopen and export through Chromium
        run: uv run --group browser pytest browser_tests -v --tb=short
      - name: Retain browser diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-review-diagnostics
          path: output/playwright/
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: docker build -t obs-agent .

      - name: Smoke-test the API container
        run: |
          docker run -d --name obs-agent -p 8000:8000 obs-agent
          for i in $(seq 1 20); do
            curl -sf http://localhost:8000/health && break
            sleep 1
          done
          curl -sf http://localhost:8000/health
          curl -sf http://localhost:8000/openapi.json > /dev/null
          docker logs obs-agent
          docker rm -f obs-agent
