name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      # --locked fails if uv.lock is out of date with pyproject.toml.
      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Check Markdown links
        run: uv run python scripts/check_markdown_links.py

      - name: Run unit tests
        run: uv run pytest tests/ -v --tb=short -m "not integration"

      - name: Run eval dry-run (deterministic)
        run: uv run evals.py --dry-run

      - name: Check caller tracing backpressure with fictional retrieval
        if: matrix.python-version == '3.12'
        run: uv run python -m scripts.telemetry_load_check > telemetry-load-results.json

      - name: Retain caller tracing measurements
        if: always() && matrix.python-version == '3.12'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: telemetry-load-fixture
          path: telemetry-load-results.json
          retention-days: 7

  mlops:
    # Optional MLflow tracing/eval integration (dependency group "mlops").
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv and Python 3.12
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies (with mlops group)
        run: uv sync --locked --group mlops

      - name: Run MLflow integration tests
        env:
          MLFLOW_DISABLE_AGENT_HINT: "1"
        run: uv run pytest tests/test_observability.py -v --tb=short

  local-rag:
    uses: ./.github/workflows/rag-stack.yml
    permissions:
      contents: read

  review-persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify review decisions survive container recreation
        run: python3 scripts/review_persistence_check.py

  browser-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install optional browser dependencies
        run: |
          uv sync --locked --group browser
          uv run --group browser playwright install --with-deps chromium
      - name: Review, save, reopen and export through Chromium
        run: uv run --group browser pytest browser_tests -v --tb=short
      - name: Retain browser diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-review-diagnostics
          path: output/playwright/
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: docker build -t obs-agent .

      - name: Smoke-test the API container
        run: |
          docker run -d --name obs-agent -p 8000:8000 obs-agent
          for i in $(seq 1 20); do
            curl -sf http://localhost:8000/health && break
            sleep 1
          done
          curl -sf http://localhost:8000/health
          curl -sf http://localhost:8000/openapi.json > /dev/null
          docker logs obs-agent
          docker rm -f obs-agent
