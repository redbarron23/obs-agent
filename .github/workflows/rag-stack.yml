name: Reusable RAG stack checks

on:
  workflow_call:
    inputs:
      provider_sha:
        description: Exact provider SHA; empty uses the checked-in Compose pin
        type: string
        default: ""

jobs:
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      COMPOSE_PROJECT_NAME: obs-rag-ci-${{ github.run_id }}-${{ github.run_attempt }}
      OBS_POLICY_TRACE_SERVICE: obs-policy-ci-${{ github.run_id }}-${{ github.run_attempt }}
      OBS_RAG_TRACE_SERVICE: obs-rag-ci-${{ github.run_id }}-${{ github.run_attempt }}
      OBS_JAEGER_UI_PORT: "0"
      RAG_REPO_PATH: ${{ inputs.provider_sha != '' && format('https://github.com/redbarron23/rag-observability.git#{0}', inputs.provider_sha) || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Record the consumer revision and pinned RAG source
        run: |
          git rev-parse HEAD | tee -a "$GITHUB_STEP_SUMMARY"
          docker compose -f compose.rag.yml config --format json | python -c 'import json,sys; print(json.load(sys.stdin)["services"]["rag"]["build"]["context"])' | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Build and start the simulation
        run: docker compose -f compose.rag.yml up -d --build --wait --wait-timeout 600

      - name: Check real retrieval and authentication without an LLM
        run: docker compose -f compose.rag.yml --profile checks run --rm --no-deps smoke

      - name: Reject a controlled HTTP contract break
        run: docker compose -f compose.rag.yml --profile checks run --rm --no-deps smoke --contract-break

      - name: Propagate stale source state and restore current retrieval
        run: |
          docker compose -f compose.rag.yml exec -T --user root rag python -c 'from pathlib import Path; p=Path("/corpus/reference/tagging-standard.md"); p.with_suffix(".check-backup").write_bytes(p.read_bytes()); p.write_text(p.read_text() + "\nDisposable freshness check.\n")'
          docker compose -f compose.rag.yml --profile checks run --rm --no-deps smoke --stale
          docker compose -f compose.rag.yml exec -T --user root rag python -c 'from pathlib import Path; p=Path("/corpus/reference/tagging-standard.md"); p.with_suffix(".check-backup").replace(p)'
          docker compose -f compose.rag.yml --profile checks run --rm --no-deps smoke

      - name: Check graceful failure when RAG stops
        run: |
          docker compose -f compose.rag.yml stop rag
          docker compose -f compose.rag.yml --profile checks run --rm --no-deps smoke --rag-down

      - name: Enable Jaeger and verify the real consumer's retrieval trace
        run: |
          docker compose -f compose.rag.yml down
          docker compose -f compose.rag.yml -f compose.telemetry.yml up -d --build --wait --wait-timeout 600
          docker compose -f compose.rag.yml -f compose.telemetry.yml --profile checks run --rm --no-deps --entrypoint python smoke /checks/telemetry.py

      - name: Verify collector outage and fresh trace recovery
        run: |
          docker compose -f compose.rag.yml -f compose.telemetry.yml stop jaeger
          docker compose -f compose.rag.yml -f compose.telemetry.yml --profile checks run --rm --no-deps smoke
          docker compose -f compose.rag.yml -f compose.telemetry.yml start jaeger
          docker compose -f compose.rag.yml -f compose.telemetry.yml --profile checks run --rm --no-deps --entrypoint python smoke /checks/telemetry.py

      - name: Measure caller backpressure during real RAG retrieval
        run: docker compose -f compose.rag.yml -f compose.telemetry.yml --profile checks run --rm --no-deps --entrypoint python smoke /checks/telemetry-load.py --live-rag > telemetry-stack-load-results.json

      - name: Retain combined-stack caller measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: telemetry-load-stack
          path: telemetry-stack-load-results.json
          retention-days: 7

      - name: Show service diagnostics
        if: always()
        run: docker compose -f compose.rag.yml -f compose.telemetry.yml logs --no-color api ui rag jaeger

      - name: Remove the disposable simulation
        if: always()
        run: docker compose -f compose.rag.yml -f compose.telemetry.yml down -v

